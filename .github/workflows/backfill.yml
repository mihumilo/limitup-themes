name: 批量回填历史

# 手动触发的批量回填（chunk 分片并行跑），日常不需要它 —— 日常靠 daily.yml。
#
# 与 daily.yml 同一套规则：**没有交易日历**。
#   · 候选日期 = 周一~周五
#   · 已在 nontrading-days.json 里的日期直接跳过（那是失败满 2 次的）
#   · 区间内所有日期都不需要跑时，用一个"空分片"占位，避免 matrix 为空数组报错
#   · ★ force=true 才会重跑「已存在且 verified=true」的日期。
#     修历史坏数据必须勾它 —— 否则会被 run_one 的幂等跳过，永远修不好
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '开始日期 YYYYMMDD'
        required: true
        default: '20260101'
      end_date:
        description: '结束日期 YYYYMMDD（建议一次不超过 120 天）'
        required: true
        default: '20260916'
      shards:
        description: '并行分片数'
        required: false
        default: '8'
      force:
        description: '强制重跑（忽略已存在且已校验的结果）'
        required: false
        type: boolean
        default: false
      reset_tries:
        description: '先清空 nontrading-days.json 的失败计数与已判定名单（批量重建数据时勾）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 批量重建数据时勾 reset_tries：清空「已判定非交易日」与失败计数。
      # 放在 prepare 里、生成分片之前 —— 这样分片生成读到的就是清空后的名单，
      # 所有分片看到的也是同一份（放在 transcribe 里会因矩阵并发而互相覆盖）。
      #
      # ★ 两个坑（都踩过，别改回去）：
      #   ① 必须用 `--reset-only`，**不能用 `--reset-tries --dry`**。
      #      --dry 会以 2 退出（语义是"仍有缺口"），而 Actions 用 `bash -e` 跑 step
      #      → python 一退出，后面的 git commit/push 全都不执行，prepare 作业失败
      #      → 依赖它的 transcribe 被跳过 → 整条回填什么都不做。
      #      --reset-only 的退出码恒为 0。
      #   ② 推送只是「持久化」，**本轮正确性不依赖它**：紧接着的「生成分片」读的是
      #      本作业工作区里已经清空的文件。所以推送失败只能告警，绝不能中断作业。
      #      另外 `git add` 也要判存在性，文件不存在时 pathspec 报错同样会中断 step。
      - name: 清空失败计数（可选）
        if: ${{ inputs.reset_tries }}
        run: |
          python -u scripts/backfill_gaps.py --reset-only || {
            echo "::error::清空失败计数失败"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -e nontrading-days.json ]; then git add nontrading-days.json; fi

          if git diff --cached --quiet; then
            echo "无变化（名单本来就是空的）"
          else
            git commit -m "chore: 清空非交易日判定（准备批量重建）"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "第 $i 次推送失败，重试…"; sleep $((i*5))
            done
            if [ "$pushed" != "1" ]; then
              echo "::warning::清空结果未能推送到远端（不影响本次回填：分片生成读的是本地已清空的文件；"
              echo "::warning::但下次定时运行可能仍读到旧名单，可重跑一次或手动提交 nontrading-days.json）"
            fi
          fi

      - name: 生成分片（工作日为候选，跳过已判定非交易日）
        id: gen
        run: |
          python - "${{ inputs.start_date }}" "${{ inputs.end_date }}" "${{ inputs.shards }}" <<'PYEOF' >> $GITHUB_OUTPUT
          import sys, json
          from datetime import datetime, timedelta
          s = datetime.strptime(sys.argv[1], '%Y%m%d')
          e = datetime.strptime(sys.argv[2], '%Y%m%d')
          n = max(1, int(sys.argv[3]))
          # 已取消交易日历：用「周一至周五」当候选，并跳过已判定跳过的日期
          # （补跑拿不到的日期，由 backfill_gaps.py 失败满 2 次后写入 nontrading-days.json）
          skip = set()
          try:
              with open('nontrading-days.json', encoding='utf-8') as f:
                  skip = set(json.load(f).get('dates') or [])
          except Exception:
              pass
          days = []
          d = s
          while d <= e:
              ds = d.strftime('%Y%m%d')
              if d.weekday() < 5 and ds not in skip:
                  days.append(ds)
              d += timedelta(days=1)
          print('# 候选 %d 天（工作日；已排除 %d 个已判定跳过的日期）' % (len(days), len(skip)))
          if not days:
              # ★ matrix 不能是空数组，否则 Actions 会报
              #   "Matrix must define at least one vector" 让整条工作流失败。
              #   输出一个 start 为空串的占位分片，后面两步用 if 判断直接跳过。
              print('# 区间内没有需要回填的日期，输出占位分片')
              print('matrix=' + json.dumps({'chunk': [{'start': '', 'end': ''}]}))
          else:
              k = max(1, (len(days) + n - 1) // n)
              chunks = [days[i:i + k] for i in range(0, len(days), k)]
              for c in chunks:
                  print('# 分片 %s ~ %s（%d 天）' % (c[0], c[-1], len(c)))
              print('matrix=' + json.dumps(
                  {'chunk': [{'start': c[0], 'end': c[-1]} for c in chunks if c]}))
          PYEOF

  transcribe:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 区间内某天拿不到数据是正常现象（节假日/未发布），所以用 continue-on-error
      # 而不是 `|| true` —— 前者在 UI 上仍能看出"这个分片有失败"，后者是彻底静默。
      - name: 跑转录 ${{ matrix.chunk.start }} ~ ${{ matrix.chunk.end }}
        if: matrix.chunk.start != ''
        continue-on-error: true
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/pipeline.py --range ${{ matrix.chunk.start }} ${{ matrix.chunk.end }} --force
          else
            python scripts/pipeline.py --range ${{ matrix.chunk.start }} ${{ matrix.chunk.end }}
          fi

      # ★ 提交前先校验产出：进程若在写文件时被中断（超时 / runner 回收），
      #   themes/<日期>.json 可能是**只写了一半的残文件**。直接提交会让坏 JSON 进仓库，
      #   Worker 解析时报错，而且「文件已存在」还会让下次运行跳过它 —— 脏数据就永久留住了。
      #   这里逐个 json.load 校验，坏的**删掉**（下次运行会重新尝试），好的才提交。
      - name: 校验产出（坏 JSON 直接删除，避免提交脏数据）
        if: matrix.chunk.start != ''
        run: |
          python - <<'PYEOF'
          import glob, json, os
          bad, good = [], 0
          for fp in sorted(glob.glob('themes/*.json') + glob.glob('review/*.json')):
              try:
                  with open(fp, encoding='utf-8') as f:
                      json.load(f)
                  good += 1
              except Exception as e:
                  bad.append((fp, str(e)[:80]))
                  try: os.remove(fp)
                  except Exception: pass
          print('产出校验：有效 %d 个' % good)
          if bad:
              for fp, why in bad:
                  print('  ✗ 删除残缺文件 %s（%s）' % (fp, why))
              print('::warning::本分片有 %d 个残缺产出已删除，下次运行会重新尝试' % len(bad))
          else:
              print('  无残缺文件 ✓')
          PYEOF

      - name: 提交
        if: matrix.chunk.start != ''
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只 add 存在的路径（nontrading-days.json 可能还不存在）
          for p in themes review nontrading-days.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done

          # 进度：本分片实际产出了几天的主题数据（下一段日志里能一眼看到）
          echo "本分片 themes/ 下共 $(ls themes/*.json 2>/dev/null | wc -l) 个日期文件"

          if git diff --cached --quiet; then
            echo "本分片无新增（可能已全部补齐，或本次没拿到数据）"
          else
            git commit -m "chore: 回填 ${{ matrix.chunk.start }}-${{ matrix.chunk.end }}"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "第 $i 次推送失败，重试…"; sleep $((i*5))
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::本分片的产出**未能推送到远端**（磁盘上的结果会随 runner 一起丢弃）。"
              echo "::error::重跑一次本工作流即可；分区间、减少 shards 可降低并发推送冲突。"
            fi
          fi
