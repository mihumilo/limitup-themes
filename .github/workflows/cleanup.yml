name: 清理历史 JSON（保留最近 N 个交易日）

on:
  schedule:
    # 北京时间 09:00，**每天**执行（含周末）—— 清理不依赖交易日，不必限工作日；
    # 早期版本限了 1-5，导致周六上午仓库里还留着周五、周四的 JSON。
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      keep:
        description: '保留最近多少个交易日的 JSON（默认 30）'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GITEE_USER: ${{ secrets.GITEE_USER }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 按「实际存在的日期文件数」保留最近 N 个交易日：
      # themes/ 与 review/ 里每个文件就是一天，按文件名（日期）排序取后 N 个即可 ——
      # 比用自然日倒数（30 交易日 ≈ 42 自然日）更准，也不会因节假日误删。
      - name: 保留最近 N 个交易日
        run: |
          KEEP="${{ github.event.inputs.keep }}"
          if [ -z "$KEEP" ]; then KEEP=30; fi
          echo "保留最近 $KEEP 个交易日"
          for d in themes review; do
            [ -d "$d" ] || continue
            n=$(ls "$d"/*.json 2>/dev/null | wc -l)
            echo "[$d] 现有 $n 个文件"
            if [ "$n" -gt "$KEEP" ]; then
              ls "$d"/*.json | sort | head -n "-$KEEP" | while read -r f; do
                rm -f "$f"
                echo "  删除 $f"
              done
            fi
            echo "[$d] 剩余 $(ls "$d"/*.json 2>/dev/null | wc -l) 个"
          done

      - name: 提交删除结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A themes review
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "chore: 清理历史 JSON（保留最近 30 个交易日）$(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi

      # 与 Gitee 镜像保持一致（未配 Secrets 则自动跳过）
      - name: 同步删除到 Gitee 镜像
        if: env.GITEE_TOKEN != '' && env.GITEE_USER != ''
        run: |
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/limitup-themes.git"
          git push gitee HEAD:main --force || echo "Gitee 同步失败（不影响主流程）"
