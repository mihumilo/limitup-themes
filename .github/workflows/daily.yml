name: 每日官方复盘转录

# 每天跑两次，**不做任何交易日判断**：
#   北京 16:30（官方复盘帖一般 15:30~16:30 发布）—— 第一次
#   北京 18:00 —— 第二次（只在第一次没拿到时才真正干活）
#
# 规则（很朴素，没有日历、没有告警）：
#   · 当天已经有 verified=true 的产出 → 直接跳过，不再请求上游
#   · 两次都拿不到 → 就算了，当天不做任何标记、不发通知
#   · 任何一步失败都不会把作业判红（都是 continue-on-error），
#     想看结果就看日志和 artifact
#
# cron 写「每天」而不是 1-5：省得漏掉调休上班的周六/周日。
on:
  schedule:
    - cron: '30 8 * * *'      # UTC 08:30 = 北京 16:30
    - cron: '0 10 * * *'      # UTC 10:00 = 北京 18:00
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYYMMDD（留空=今天）'
        required: false
      force:
        description: '强制重跑（忽略已校验结果）'
        type: boolean
        default: false
      locate_only:
        description: '只做连通性自检：定位帖子+下载长图，不做 OCR（秒级完成，排查 401 用）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 解析回归自测：纯内存构造坐标，不联网、不 OCR，几秒跑完。
      # ★ 以前这个脚本只在本地手跑，改坏了 parser 要等到产出数据异常才发现。
      #   放进 CI 后每次运行都会验证；失败只告警不判红（continue-on-error）。
      #   themes/ 为空时「规模仿真」会自动跳过（脚本里已处理）。
      - name: 解析回归自测
        continue-on-error: true
        run: python -u scripts/test_parse.py

      # 目标日期（手动触发可指定）。不再区分"第几次"——两次调用的逻辑完全一样，
      # 靠「已有 verified 产出就跳过」来实现"拿到就不跑第二次"。
      - name: 确定目标日期
        id: meta
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(TZ=Asia/Shanghai date +%Y%m%d); fi
          echo "date=$DATE" >> $GITHUB_OUTPUT

      # 自动补齐缺失的日期（保留最近 90 个有数据的日子，与 Worker 侧 KV 一致）。
      # 候选 = 工作日 ∩ 不在 nontrading-days.json 里 —— 不需要任何交易日历。
      # 失败不影响当天转录；一次最多补 6 天，剩下的留给后续运行继续补
      # （从 30 扩到 90 时缺口约 60 天，按每天两次定时跑 ≈ 5 天补齐，属正常节奏）。
      - name: 补跑缺失日期
        continue-on-error: true
        run: python -u scripts/backfill_gaps.py --keep 90 --max 6

      # -u：关闭输出缓冲，实时看到每一步日志
      # 已 verified 的日期会被 pipeline 自动跳过（这就是"拿到就不跑第二次"）
      - name: 跑转录
        id: run
        continue-on-error: true
        env:
          REVIEW_API_BASE: ${{ vars.REVIEW_API_BASE }}
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          LOCATE=""
          if [ "${{ github.event.inputs.locate_only }}" = "true" ]; then LOCATE="--locate-only"; fi
          echo "目标日期: ${{ steps.meta.outputs.date }}  图源API: ${REVIEW_API_BASE:-未配置(直接爬同花顺)}"
          python -u scripts/pipeline.py --date "${{ steps.meta.outputs.date }}" $FORCE $LOCATE

      # 自动体检：关键词是否混入连板/成交额、连板数是否全为 1、时间缺失、家数偏差。
      # 纯诊断，发现问题只打印（退出码恒为 0），不判作业成败。
      - name: 产出体检
        continue-on-error: true
        run: python -u scripts/check_output.py "${{ steps.meta.outputs.date }}"

      # 只 add 实际存在的路径 —— 之前写死 nontrading-days.json，文件不存在时
      # `git add` 会报 "pathspec did not match any files" 并把作业判红。
      - name: 提交结果
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in themes review nontrading-days.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "无新增数据"
          else
            git commit -m "chore: 更新官方复盘主题分类 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "第 $i 次推送失败，重试…"; sleep $((i*5))
            done
          fi

      # 排障用：OCR 原始数据（每个文字块的文本+坐标）
      # 数据备份同步：目标由仓库根的 backup.config.json 指定（本地目录 / 任意 git 远端）。
      # 默认 enabled=false，什么都不做；配好目标后才会真正同步。凭据走 Secrets → 环境变量。
      - name: 数据备份同步
        continue-on-error: true
        env:
          BACKUP_GIT_TOKEN: ${{ secrets.BACKUP_GIT_TOKEN }}
        run: python -u scripts/backup_sync.py

      - name: 上传 OCR 原始数据（排障用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-raw-${{ github.run_id }}
          path: _work/ocr_*.json
          if-no-files-found: ignore
          retention-days: 7
