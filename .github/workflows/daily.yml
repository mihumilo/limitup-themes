name: 每日官方复盘转录

on:
  schedule:
    # 北京时间 16:30（官方复盘帖一般 15:30~16:30 发布）—— 第一次
    - cron: '30 8 * * 1-5'
    # 北京时间 20:00 —— 第二次补跑：若首次未拿到图 / OCR 未通过校验，这次再试
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYYMMDD（留空=今天）'
        required: false
      force:
        description: '强制重跑（忽略已校验结果）'
        type: boolean
        default: false
      locate_only:
        description: '只做连通性自检：定位帖子+下载长图，不做 OCR（秒级完成，排查 401 用）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    # secrets 不能直接用在 step 的 if: 表达式里（会被判 Invalid workflow），
    # 统一先注入 job 级 env，if 里用 env.* 判断，run 里用 shell 变量引用
    env:
      GITEE_USER: ${{ secrets.GITEE_USER }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -u：关闭输出缓冲，实时看到每一步日志（不然要等进程结束才一次性刷出来）
      # REVIEW_API_BASE：可选，填 Worker 的 /api/review 地址，用于绕开 GitHub 出口限制
      - name: 跑转录
        env:
          REVIEW_API_BASE: ${{ vars.REVIEW_API_BASE }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(TZ=Asia/Shanghai date +%Y%m%d); fi
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          LOCATE=""
          if [ "${{ github.event.inputs.locate_only }}" = "true" ]; then LOCATE="--locate-only"; fi
          echo "目标日期: $DATE  图源API: ${REVIEW_API_BASE:-未配置(直接爬同花顺)}"
          python -u scripts/pipeline.py --date "$DATE" $FORCE $LOCATE || true

      # 自动体检：关键词是否混入连板/成交额、连板数是否全为 1、时间缺失、家数偏差
      - name: 产出体检
        if: always()
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(TZ=Asia/Shanghai date +%Y%m%d); fi
          python -u scripts/check_output.py "$DATE" || true

      # 排障用：把 OCR 原始数据（每个文字块的文本+坐标）上传为 artifact。
      # 解析结果不理想时，从 Actions 页面下载它，就能在本地离线复现与调参。
      - name: 上传 OCR 原始数据（排障用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-raw-${{ github.run_id }}
          path: _work/ocr_*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes review
          if git diff --cached --quiet; then
            echo "无新增数据"
          else
            git commit -m "chore: 更新官方复盘主题分类 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi

      # 国内备用链路：同步一份到 Gitee 镜像仓库（需在 Secrets 配 GITEE_USER / GITEE_TOKEN）
      # 未配置则自动跳过，不影响主流程
      - name: 同步到 Gitee 镜像（国内备用）
        if: env.GITEE_TOKEN != '' && env.GITEE_USER != ''
        run: |
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/limitup-themes.git"
          git push gitee HEAD:main --force || echo "Gitee 同步失败（不影响主流程）"
