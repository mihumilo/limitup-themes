name: 交易日历核对

# 交易日历是 daily.yml 的「门禁」：决定当天要不要跑、以及失败时是"正常非交易日"还是"真故障"。
# 它从「上证指数日K」推导（有K线的那天=交易日），会随当年交易日推进而增长，
# 所以每周核一次；每年 11 月起也会顺带尝试拉取下一年的数据（次年有K线后才拿得到）。
on:
  schedule:
    # 北京时间周一 10:20
    - cron: '20 2 * * 1'
  workflow_dispatch:
    inputs:
      year:
        description: '指定年份 YYYY（留空=今年与明年）'
        required: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 刷新交易日历
        id: refresh
        continue-on-error: true
        run: |
          YEARS=""
          if [ -n "${{ github.event.inputs.year }}" ]; then
            YEARS="${{ github.event.inputs.year }}"
          else
            YEARS="$(TZ=Asia/Shanghai date +%Y) $(( $(TZ=Asia/Shanghai date +%Y) + 1 ))"
          fi
          for Y in $YEARS; do
            echo "== $Y =="
            python -u scripts/trading_calendar.py --year "$Y" || echo "  $Y 拉取失败（后续运行会自动重试）"
          done

      - name: 与旧值比对
        run: |
          python - <<'PY'
          import json, os, subprocess
          f = 'trading-calendar.json'
          if not os.path.exists(f):
              print('日历文件不存在'); raise SystemExit(0)
          cur = json.load(open(f, encoding='utf-8'))
          try:
              old_raw = subprocess.run(['git', 'show', 'HEAD:' + f], capture_output=True)
              old = json.loads(old_raw.stdout.decode('utf-8')) if old_raw.returncode == 0 else {'years': {}}
          except Exception:
              old = {'years': {}}
          changed = 0
          for y, info in (cur.get('years') or {}).items():
              o = (old.get('years') or {}).get(y) or {}
              a, b = set(info.get('trading') or []), set(o.get('trading') or [])
              add, rem = sorted(a - b), sorted(b - a)
              if add or rem:
                  changed += 1
                  print('%s 年：新增交易日 %d 个%s，移除 %d 个%s'
                        % (y, len(add), ('（最近：%s）' % add[-1]) if add else '',
                           len(rem), ('（%s）' % ','.join(rem[:5])) if rem else ''))
          print('updated: %s → %s' % (old.get('updated') or '无', cur.get('updated')))
          print('无变化 ✓' if not changed else '共 %d 个年份有变化' % changed)
          PY

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading-calendar.json
          if git diff --cached --quiet; then
            echo "交易日历无变化"
          else
            git commit -m "chore: 核对交易日历 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "第 $i 次推送失败，重试…"; sleep $((i*5))
            done
          fi

      # 连续拉不到（两个数据源都失败）才告警 —— 偶尔一次失败不打扰
      - name: 拉取失败告警
        if: steps.refresh.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="交易日历刷新失败"
          if gh issue list --state open --search "$TITLE in:title" --json title --jq '.[].title' | grep -qF "$TITLE"; then
            echo "已有同名 Issue，跳过"; exit 0
          fi
          cat > _issue.md <<'BODY'
          ## 交易日历刷新失败

          腾讯与东财两个数据源都取不到上证指数日K。

          ### 影响

          - `daily.yml` 会退回「周一至周五」判断
          - 「两次都拉不到」仍会按非交易日处理（不告警），**不会误报**
          - 但节假日会白跑，调休上班日可能漏跑

          ### 恢复

          上游恢复后，下次定时运行会自动补上；也可以手动重跑本工作流。

          运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BODY
          gh issue create --title "$TITLE" --label "auto-alert" --body-file _issue.md
